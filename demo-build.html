<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Widget Demo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      height: 150vh; /* make it scrollable to test fixed position */
      background-color: #f0f2f5;
    }
    h1 { margin-top: 50px; }
  </style>
  <!-- Exactly what a customer pastes, pointed at the local build. -->
  <script src="./dist/widget-loader.js" data-client-id="20cb9cd2-5b65-4e9e-9852-f0555d257fc3" async></script>
</head>
<body>
  <h1>Welcome to Example Website!</h1>
  <p>The chat widget appears as configured in the dashboard (Integrations → widget → Appearance).</p>
  <p>
    <button onclick="AlapaiWidget('hide')">hide</button>
    <button onclick="AlapaiWidget('show')">show</button>
    <button onclick="AlapaiWidget('open')">open</button>
    <button onclick="AlapaiWidget('close')">close</button>
    <button onclick="history.pushState({}, '', '/admin')">go to /admin (SPA)</button>
    <button onclick="history.back()">back</button>
  </p>
</body>
</html>
